<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Legends — IPL 2026</title>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --card:      #1c2230;
    --border:    #30363d;
    --accent:    #f0a500;
    --accent2:   #1d8cf8;
    --green:     #3fb950;
    --red:       #f85149;
    --purple:    #a371f7;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --me:        #0d1f2d;
    --me-border: #1d8cf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #e88c1a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .header .meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .meta-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .meta-pill span { color: var(--text); font-weight: 600; }
  .meta-pill.result { border-color: var(--green); color: var(--green); }
  .meta-pill.result span { color: var(--green); }

  /* ── Section ── */
  .section { margin-bottom: 32px; }
  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
  }
  thead th {
    background: var(--surface);
    padding: 11px 14px;
    text-align: left;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  thead th.num { text-align: right; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr.is-me {
    background: var(--me);
    border-left: 3px solid var(--me-border);
  }
  tbody tr.is-me:hover { background: #0e2235; }
  td {
    padding: 12px 14px;
    font-size: 0.88rem;
    white-space: nowrap;
  }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ── Rank badge ── */
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .rank-1 { background: linear-gradient(135deg,#f0a500,#e88c1a); color: #000; }
  .rank-2 { background: linear-gradient(135deg,#c0c0c0,#888); color: #000; }
  .rank-3 { background: linear-gradient(135deg,#cd7f32,#8b4513); color: #fff; }
  .rank-n { background: var(--card); color: var(--muted); }

  /* ── Team name ── */
  .team-name { font-weight: 600; }
  .team-name .me-tag {
    font-size: 0.65rem;
    background: var(--accent2);
    color: #fff;
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
    font-weight: 700;
    vertical-align: middle;
  }

  /* ── Points ── */
  .pts-big  { font-weight: 700; color: var(--text); }
  .pts-good { color: var(--green); font-weight: 600; }
  .pts-meh  { color: var(--accent); }
  .pts-na   { color: var(--border); font-style: italic; font-size: 0.8rem; }

  /* ── Transfer bar ── */
  .xfer-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .xfer-bar {
    width: 60px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .xfer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--accent));
    border-radius: 2px;
  }

  /* ── Boosters ── */
  .booster-list { display: flex; gap: 4px; flex-wrap: wrap; }
  .booster-chip {
    font-size: 0.68rem;
    background: rgba(163,113,247,0.15);
    border: 1px solid rgba(163,113,247,0.35);
    color: var(--purple);
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .booster-chip.used {
    background: rgba(248,81,73,0.1);
    border-color: rgba(248,81,73,0.3);
    color: var(--red);
    text-decoration: line-through;
    opacity: 0.6;
  }
  .booster-count {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--purple);
  }

  /* ── C/VC badges ── */
  .cap { display: inline-block; font-size: 0.7rem; font-weight: 700;
         background: var(--accent); color: #000;
         border-radius: 4px; padding: 1px 5px; margin-right: 3px; }
  .vc  { display: inline-block; font-size: 0.7rem; font-weight: 700;
         background: var(--surface); color: var(--muted);
         border: 1px solid var(--border);
         border-radius: 4px; padding: 1px 5px; margin-right: 3px; }

  /* ── Efficiency ── */
  .eff-high { color: var(--green); font-weight: 600; }
  .eff-mid  { color: var(--accent); }
  .eff-low  { color: var(--red); }

  /* ── Footer ── */
  .footer {
    text-align: center;
    color: var(--border);
    font-size: 0.75rem;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--muted); text-decoration: none; }
  .footer a:hover { color: var(--text); }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🏏 Fantasy Legends</h1>
  <div class="subtitle">IPL 2026 — Season Long Fantasy</div>
  <div class="meta" id="meta-pills"></div>
</div>

<div class="section">
  <div class="section-title">Season Grand Standings</div>
  <div class="table-wrap">
    <table id="grand-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Team</th>
          <th class="num">Season Pts</th>
          <th class="num">Xfers Used</th>
          <th class="num">Xfers Left</th>
          <th>Boosters Left</th>
          <th class="num">Efficiency</th>
        </tr>
      </thead>
      <tbody id="grand-body"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-title" id="match-section-title">Latest Match</div>
  <div class="table-wrap">
    <table id="match-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Team</th>
          <th>C</th>
          <th>VC</th>
          <th class="num">Sq Players</th>
          <th class="num">Match Pts</th>
          <th class="num">Xfers Used</th>
          <th>Boosters</th>
        </tr>
      </thead>
      <tbody id="match-body"></tbody>
    </table>
  </div>
</div>

<div class="footer">
  Updated <span id="updated-at">—</span> ·
  <a href="https://fantasy.iplt20.com/classic/league/view/790973705" target="_blank">Open League ↗</a>
</div>

<script>
const DATA_URL = 'data/fantasy_data.json';

function na(v, fmt) {
  if (v === null || v === undefined) return '<span class="pts-na">—</span>';
  return fmt ? fmt(v) : v;
}

function rankBadge(r) {
  const cls = r <= 3 ? `rank-${r}` : 'rank-n';
  return `<span class="rank-badge ${cls}">${r}</span>`;
}

function effClass(v) {
  if (!v) return '';
  if (v >= 90) return 'eff-high';
  if (v >= 70) return 'eff-mid';
  return 'eff-low';
}

function boosterChips(boosters_used, remaining) {
  if (boosters_used === null) return '<span class="pts-na">—</span>';
  // For others: [{count: N}] — just show count + remaining
  if (boosters_used.length > 0 && boosters_used[0].count !== undefined) {
    const usedCount = boosters_used[0].count;
    const remHtml = remaining > 0 ? ` <span class="booster-count">+${remaining} left</span>` : '';
    const chips = Array.from({length: usedCount}, () =>
      `<span class="booster-chip used">used</span>`).join('');
    return `<div class="booster-list">${chips}${remHtml}</div>`;
  }
  // For me: full booster details
  const chips = (boosters_used || []).map(b =>
    `<span class="booster-chip used" title="GD${b.gameday}">${b.name}</span>`
  );
  const leftHtml = remaining > 0
    ? `<span class="booster-count">+${remaining} left</span>`
    : '';
  return `<div class="booster-list">${chips.join('')}${leftHtml}</div>`;
}

function boosterUsedThisMatch(boosters) {
  if (!boosters || !boosters.length) return '<span class="pts-na">none</span>';
  return boosters.map(b => `<span class="booster-chip" style="text-decoration:none;">${b.name}</span>`).join(' ');
}

function xferBar(used, left) {
  const total = (used || 0) + (left || 0);
  const pct = total > 0 ? Math.round(((left || 0) / total) * 100) : 0;
  return `
    <div class="xfer-bar-wrap">
      <div class="xfer-bar"><div class="xfer-fill" style="width:${pct}%"></div></div>
      <span>${left ?? '—'}</span>
    </div>`;
}

function pts(v, cls='') {
  if (v === null || v === undefined) return '<span class="pts-na">—</span>';
  return `<span class="${cls || 'pts-big'}">${Number(v).toFixed(1)}</span>`;
}

async function load() {
  let data;
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    data = await r.json();
  } catch(e) {
    document.body.innerHTML += '<p style="color:red;text-align:center">Failed to load data/fantasy_data.json</p>';
    return;
  }

  // ── Meta pills ──
  const lm = data.last_match || {};
  const updated = data.last_updated ? new Date(data.last_updated).toLocaleString('en-IN',{
    day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
  document.getElementById('updated-at').textContent = updated;

  const pills = [
    lm.teams ? `<div class="meta-pill">⚔️ Last: <span>${lm.teams}</span></div>` : '',
    lm.result ? `<div class="meta-pill result">🏆 <span>${lm.result}</span></div>` : '',
    lm.venue  ? `<div class="meta-pill">📍 <span>${lm.venue.split(',').slice(-1)[0].trim()}</span></div>` : '',
    `<div class="meta-pill">👥 <span>${data.members?.length ?? 0}</span> players</div>`,
  ].filter(Boolean).join('');
  document.getElementById('meta-pills').innerHTML = pills;

  // ── Section title ──
  if (lm.teams) {
    document.getElementById('match-section-title').textContent = `Match ${data.last_gameday || ''} — ${lm.teams}`;
  }

  // ── Grand table ──
  const grandBody = document.getElementById('grand-body');
  for (const m of data.members || []) {
    const trCls = m.is_me ? 'is-me' : '';
    const eff = m.transfer_efficiency;
    const nameHtml = `<span class="team-name">${m.team_name}${m.is_me ? '<span class="me-tag">YOU</span>' : ''}</span>`;

    grandBody.innerHTML += `
      <tr class="${trCls}">
        <td>${rankBadge(m.rank)}</td>
        <td>${nameHtml}</td>
        <td class="num">${pts(m.total_points, 'pts-big')}</td>
        <td class="num">${na(m.transfers_used)}</td>
        <td class="num">${na(m.transfers_left, v => xferBar(m.transfers_used, v))}</td>
        <td>${boosterChips(m.boosters_used, m.boosters_remaining)}</td>
        <td class="num">${na(eff, v => `<span class="${effClass(v)}">${v}</span>`)}</td>
      </tr>`;
  }

  // ── Match table ──
  const matchBody = document.getElementById('match-body');
  for (const m of data.members || []) {
    const trCls = m.is_me ? 'is-me' : '';
    const lmatch = m.last_match || {};
    const nameHtml = `<span class="team-name">${m.team_name}${m.is_me ? '<span class="me-tag">YOU</span>' : ''}</span>`;

    const capHtml = lmatch.captain
      ? `<span class="cap">C</span>${lmatch.captain}`
      : '<span class="pts-na">—</span>';
    const vcHtml  = lmatch.vc
      ? `<span class="vc">VC</span>${lmatch.vc}`
      : '<span class="pts-na">—</span>';

    const matchPts = lmatch.points;
    const ptsCls = matchPts !== null && matchPts !== undefined
      ? (matchPts >= 150 ? 'pts-good' : matchPts >= 100 ? 'pts-meh' : '')
      : '';

    matchBody.innerHTML += `
      <tr class="${trCls}">
        <td>${rankBadge(m.rank)}</td>
        <td>${nameHtml}</td>
        <td>${capHtml}</td>
        <td>${vcHtml}</td>
        <td class="num">${na(lmatch.playing_count)}</td>
        <td class="num">${pts(matchPts, ptsCls || 'pts-big')}</td>
        <td class="num">${na(lmatch.transfers)}</td>
        <td>${m.is_me ? boosterUsedThisMatch(lmatch.boosters) : '<span class="pts-na">—</span>'}</td>
      </tr>`;
  }
}

load();
</script>
</body>
</html>
