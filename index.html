<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Legends — IPL 2026</title>
<style>
  :root {
    --bg:        #f5f5f7;
    --surface:   #ffffff;
    --border:    #d2d2d7;
    --row-sep:   #e8e8ed;
    --accent:    #0071e3;
    --green:     #34c759;
    --red:       #ff3b30;
    --orange:    #ff9500;
    --purple:    #af52de;
    --text:      #1d1d1f;
    --muted:     #6e6e73;
    --faint:     #aeaeb2;
    --me-bg:     #f0f7ff;
    --me-border: #0071e3;
    --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 6px 20px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 32px 20px 48px;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .header .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
    font-weight: 400;
  }
  .meta {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .meta-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.78rem;
    color: var(--muted);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .meta-pill b { color: var(--text); font-weight: 600; }
  .meta-pill.win { border-color: rgba(52,199,89,0.5); color: var(--green); }
  .meta-pill.win b { color: var(--green); }

  /* ── Section ── */
  .section { margin-bottom: 28px; }
  .section-header {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }

  thead th {
    padding: 10px 14px;
    text-align: left;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    white-space: nowrap;
    border-bottom: 1px solid var(--row-sep);
    background: #fafafb;
  }
  thead th.r { text-align: right; }
  thead th.c { text-align: center; }

  tbody tr { border-bottom: 1px solid var(--row-sep); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(0,0,0,0.018); }
  tbody tr.is-me {
    background: var(--me-bg);
    border-left: 3px solid var(--me-border);
  }
  tbody tr.is-me:hover { background: #e6f2ff; }

  td {
    padding: 11px 14px;
    font-size: 0.85rem;
    white-space: nowrap;
    color: var(--text);
  }
  td.r { text-align: right; font-variant-numeric: tabular-nums; }
  td.c { text-align: center; }

  /* ── Rank badge ── */
  .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 0.72rem; font-weight: 700;
  }
  .rank-1 { background: linear-gradient(145deg,#f5a623,#e88e0b); color: #fff; }
  .rank-2 { background: linear-gradient(145deg,#b0b8c1,#8a9199); color: #fff; }
  .rank-3 { background: linear-gradient(145deg,#cd7f32,#9e5a20); color: #fff; }
  .rank-n { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

  /* ── Team name ── */
  .tname { font-weight: 600; font-size: 0.88rem; }
  .me-tag {
    display: inline-block;
    font-size: 0.6rem; font-weight: 700;
    background: var(--accent); color: #fff;
    border-radius: 4px; padding: 1px 5px; margin-left: 6px;
    vertical-align: middle; letter-spacing: 0.02em;
  }

  /* ── Values ── */
  .val-big  { font-weight: 600; }
  .val-good { color: var(--green); font-weight: 600; }
  .val-mid  { color: var(--orange); }
  .val-low  { color: var(--red); }
  .val-na   { color: var(--faint); font-style: italic; font-size: 0.8rem; }

  /* ── Transfers bar ── */
  .xbar { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
  .xbar-track {
    width: 48px; height: 3px;
    background: var(--row-sep); border-radius: 2px; overflow: hidden; flex-shrink: 0;
  }
  .xbar-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #34aef5);
  }

  /* ── Booster count ── */
  .bst-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.75rem; font-weight: 600;
    color: var(--purple);
    background: rgba(175,82,222,0.08);
    border: 1px solid rgba(175,82,222,0.2);
    border-radius: 20px; padding: 2px 9px;
  }
  .bst-zero { color: var(--faint); background: none; border-color: var(--border); }

  /* ── C / VC badges ── */
  .cap { display: inline-block; font-size: 0.62rem; font-weight: 700;
         background: var(--orange); color: #fff;
         border-radius: 3px; padding: 1px 4px; margin-right: 4px; }
  .vc  { display: inline-block; font-size: 0.62rem; font-weight: 700;
         background: var(--muted); color: #fff;
         border-radius: 3px; padding: 1px 4px; margin-right: 4px; }

  /* ── L3 columns ── */
  .l3-pts  { color: var(--text);   font-weight: 600; }
  .l3-xfer { color: var(--muted);  }
  .l3-te   { font-weight: 600; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    color: var(--faint);
    font-size: 0.75rem;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--row-sep);
  }
  .footer a { color: var(--muted); text-decoration: none; }
  .footer a:hover { color: var(--accent); }

  @media (max-width: 600px) {
    body { padding: 16px 12px 40px; }
    .header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>🏏 Fantasy <em>Legends</em></h1>
  <div class="subtitle">IPL 2026 — Season Long Fantasy</div>
  <div class="meta" id="meta-pills"></div>
</div>

<div class="section">
  <div class="section-header">Season Grand Standings</div>
  <div class="card">
    <div class="table-wrap">
      <table id="grand-table">
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th>Team</th>
            <th class="r">Season Pts</th>
            <th class="r">Xfer Used</th>
            <th class="r">Xfer Left</th>
            <th class="c">Boosters</th>
            <th class="r">TE</th>
            <th class="r">L3 Pts</th>
            <th class="r">L3 Xfer</th>
            <th class="r">L3 TE</th>
          </tr>
        </thead>
        <tbody id="grand-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header" id="match-section-title">Latest Match</div>
  <div class="card">
    <div class="table-wrap">
      <table id="match-table">
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th>Team</th>
            <th>Captain</th>
            <th>Vice-Captain</th>
            <th class="c">Booster</th>
            <th class="r">SQ Players</th>
            <th class="r">Match Pts</th>
            <th class="r">Xfer</th>
          </tr>
        </thead>
        <tbody id="match-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">
  Updated <span id="updated-at">—</span> ·
  <a href="https://fantasy.iplt20.com/classic/league/view/790973705" target="_blank">Open League ↗</a>
</div>

</div><!-- /container -->
<script>
const DATA_URL = 'data/fantasy_data.json';

function na(v, fmt) {
  if (v === null || v === undefined) return '<span class="val-na">—</span>';
  return fmt ? fmt(v) : v;
}

function rankBadge(r) {
  const cls = r <= 3 ? `rank-${r}` : 'rank-n';
  return `<span class="rank ${cls}">${r}</span>`;
}

function teamName(m) {
  return `<span class="tname">${m.team_name}${m.is_me ? '<span class="me-tag">YOU</span>' : ''}</span>`;
}

function pts(v, cls) {
  if (v === null || v === undefined) return '<span class="val-na">—</span>';
  cls = cls || 'val-big';
  return `<span class="${cls}">${Number(v).toFixed(1)}</span>`;
}

function effClass(v) {
  if (!v && v !== 0) return '';
  if (v >= 90) return 'val-good';
  if (v >= 70) return 'val-mid';
  return 'val-low';
}

function xferBar(used, left) {
  const total = (used || 0) + (left || 0);
  const pct   = total > 0 ? Math.round(((left || 0) / total) * 100) : 0;
  return `
    <div class="xbar">
      <div class="xbar-track"><div class="xbar-fill" style="width:${pct}%"></div></div>
      <span>${left ?? '—'}</span>
    </div>`;
}

function boosterPill(remaining) {
  if (remaining === null || remaining === undefined) return '<span class="val-na">—</span>';
  const cls = remaining === 0 ? 'bst-zero' : '';
  return `<span class="bst-pill ${cls}">${remaining} left</span>`;
}

function l3stats(matches) {
  // matches is sorted newest-first; take first 3
  const slice = (matches || []).slice(0, 3);
  if (!slice.length) return { pts: null, xfer: null, te: null };
  const totalPts  = slice.reduce((s, m) => s + (m.points  || 0), 0);
  const totalXfer = slice.reduce((s, m) => s + (m.transfers || 0), 0);
  return {
    pts:  round1(totalPts),
    xfer: totalXfer,
    te:   totalXfer > 0 ? round1(totalPts / totalXfer) : null,
  };
}

function round1(v) { return Math.round(v * 10) / 10; }

async function load() {
  let data;
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    data = await r.json();
  } catch(e) {
    document.body.innerHTML += '<p style="color:var(--red);text-align:center;margin-top:40px">Failed to load data/fantasy_data.json</p>';
    return;
  }

  // ── Meta pills ──
  const lm = data.last_match || {};
  const updated = data.last_updated
    ? new Date(data.last_updated).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})
    : '—';
  document.getElementById('updated-at').textContent = updated;

  const pills = [
    lm.teams  ? `<div class="meta-pill">⚔️ Last: <b>${lm.teams}</b></div>` : '',
    lm.result ? `<div class="meta-pill win">🏆 <b>${lm.result}</b></div>` : '',
    lm.venue  ? `<div class="meta-pill">📍 <b>${lm.venue.split(',').slice(-1)[0].trim()}</b></div>` : '',
    `<div class="meta-pill">👥 <b>${data.members?.length ?? 0}</b> teams</div>`,
  ].filter(Boolean).join('');
  document.getElementById('meta-pills').innerHTML = pills;

  if (lm.teams) {
    document.getElementById('match-section-title').textContent =
      `Match ${data.last_gameday || ''} — ${lm.teams}`;
  }

  // ── Grand table ──
  const grandBody = document.getElementById('grand-body');
  for (const m of data.members || []) {
    const trCls = m.is_me ? 'is-me' : '';
    const eff   = m.transfer_efficiency;
    const l3    = l3stats(m.matches);

    grandBody.innerHTML += `
      <tr class="${trCls}">
        <td>${rankBadge(m.rank)}</td>
        <td>${teamName(m)}</td>
        <td class="r">${pts(m.total_points)}</td>
        <td class="r">${na(m.transfers_used)}</td>
        <td class="r">${na(m.transfers_left, v => xferBar(m.transfers_used, v))}</td>
        <td class="c">${boosterPill(m.boosters_remaining)}</td>
        <td class="r">${na(eff, v => `<span class="${effClass(v)}">${v}</span>`)}</td>
        <td class="r">${na(l3.pts, v => `<span class="l3-pts">${v.toFixed(1)}</span>`)}</td>
        <td class="r">${na(l3.xfer, v => `<span class="l3-xfer">${v}</span>`)}</td>
        <td class="r">${na(l3.te,  v => `<span class="l3-te ${effClass(v)}">${v}</span>`)}</td>
      </tr>`;
  }

  // ── Match table — sorted by match pts desc, rank = match position ──
  const matchBody = document.getElementById('match-body');
  const matchMembers = [...(data.members || [])]
    .sort((a, b) => ((b.last_match||{}).points||0) - ((a.last_match||{}).points||0));
  matchMembers.forEach((m, idx) => {
    const matchRank = idx + 1;
    const trCls = m.is_me ? 'is-me' : '';
    const lmatch = m.last_match || {};

    const capHtml = lmatch.captain
      ? `<span class="cap">C</span>${lmatch.captain}`
      : '<span class="val-na">—</span>';
    const vcHtml = lmatch.vc
      ? `<span class="vc">VC</span>${lmatch.vc}`
      : '<span class="val-na">—</span>';

    const mpts  = lmatch.points;
    const ptsCls = mpts != null ? (mpts >= 300 ? 'val-good' : mpts >= 150 ? 'val-mid' : '') : '';

    const boosterUsed = lmatch.booster_used || '';
    const boosterHtml = boosterUsed
      ? `<span class="bst-pill">${boosterUsed}</span>`
      : '<span class="val-na">—</span>';

    matchBody.innerHTML += `
      <tr class="${trCls}">
        <td>${rankBadge(matchRank)}</td>
        <td>${teamName(m)}</td>
        <td>${capHtml}</td>
        <td>${vcHtml}</td>
        <td class="c">${boosterHtml}</td>
        <td class="r">${na(lmatch.playing_count)}</td>
        <td class="r">${pts(mpts, ptsCls || 'val-big')}</td>
        <td class="r">${na(lmatch.transfers)}</td>
      </tr>`;
  });
}

load();
</script>
</body>
</html>
